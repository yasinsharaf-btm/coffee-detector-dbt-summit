version: 2

sources:
  - name: loffeelabs
    # local DuckDB warehouse produced by `fivetran debug` in ingestion/loffeelabs/,
    # attached under the "loffeelabs" alias in profiles.yml
    database: loffeelabs
    schema: tester
    tables:
      - name: beans
      - name: roasters
      - name: processes
      - name: origins
      - name: varieties

  - name: overpass
    # local DuckDB warehouse produced by `fivetran debug` in ingestion/overpass/,
    # attached under the "overpass" alias in profiles.yml
    database: overpass
    schema: tester
    tables:
      - name: shops
