version: 2

semantic_models:
  - name: bean_availability
    description: "Bean-level semantic model for specialty coffee availability by shop/roaster."
    model: ref('fct_bean_availability')
    defaults:
      agg_time_dimension: null
    entities:
      - name: bean
        type: primary
        expr: bean_id
      - name: shop
        type: foreign
        expr: shop_osm_id
    dimensions:
      - name: roaster_city
        type: categorical
        expr: roaster_city
      - name: process_category
        type: categorical
        expr: process_category
      - name: flavor_profile
        type: categorical
        expr: flavor_profile
    measures:
      - name: bean_count
        agg: count
        expr: bean_id
      - name: experimental_bean_count
        agg: sum
        expr: is_experimental_int

metrics:
  - name: experimental_bean_count
    label: "Experimental Bean Count"
    description: "Count of beans processed with an experimental method (anaerobic, carbonic maceration, thermal shock, co-ferment)."
    type: simple
    type_params:
      measure: experimental_bean_count

  - name: specialty_score
    label: "Specialty Score"
    description: "Ratio of experimental beans to total beans, per roaster/city/process cut."
    type: ratio
    type_params:
      numerator: experimental_bean_count
      denominator: bean_count
